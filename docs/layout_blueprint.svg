      </g>
      <g transform="translate(946,470)">
        <rect width="58" height="7"   fill="#2DD4A8"/>
        <rect y="7"  width="58" height="49" fill="#3B8FE0"/>
        <rect y="56" width="58" height="134" fill="#3E4658"/>
      </g>
      <g transform="translate(1024,470)">
        <rect width="58" height="5"   fill="#2DD4A8"/>
        <rect y="5"  width="58" height="61" fill="#3B8FE0"/>
        <rect y="66" width="58" height="124" fill="#3E4658"/>
      </g>
      <g transform="translate(1102,470)">
        <rect width="58" height="8"   fill="#2DD4A8"/>
        <rect y="8"  width="58" height="54" fill="#3B8FE0"/>
        <rect y="62" width="58" height="128" fill="#3E4658"/>
      </g>
      <g transform="translate(1180,470)">
        <rect width="58" height="6"   fill="#2DD4A8"/>
        <rect y="6"  width="58" height="56" fill="#3B8FE0"/>
        <rect y="62" width="58" height="128" fill="#3E4658"/>
      </g>
