    <text x="34" y="330" fill="#5C677D" font-size="9" letter-spacing="1.6">TICKET TYPE</text>
    <g font-size="10">
      <rect x="30" y="340" width="53" height="28" rx="6" fill="#171A21" stroke="#252A34"/>
      <text x="43" y="358" fill="#C9D1DE">NCMC</text>
      <rect x="88" y="340" width="53" height="28" rx="6" fill="#171A21" stroke="#252A34"/>
      <text x="103" y="358" fill="#C9D1DE">QR</text>
      <rect x="146" y="340" width="52" height="28" rx="6" fill="#171A21" stroke="#252A34"/>
      <text x="158" y="358" fill="#C9D1DE">Other</text>
