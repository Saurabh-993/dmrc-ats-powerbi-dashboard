      <rect x="360" y="512" width="136" height="13" rx="3" fill="#FF4757"/>
      <text x="250" y="544" fill="#C9D1DE">Sikanderpur</text>
      <rect x="360" y="534" width="119" height="13" rx="3" fill="#FFC72C"/>
      <text x="250" y="566" fill="#C9D1DE">INA</text>
      <rect x="360" y="556" width="102" height="13" rx="3" fill="#FFC72C"/>
      <text x="250" y="588" fill="#C9D1DE">Pratap Nagar</text>
      <rect x="360" y="578" width="100" height="13" rx="3" fill="#FF4757"/>
      <text x="250" y="610" fill="#C9D1DE">New Delhi</text>
      <rect x="360" y="600" width="99" height="13" rx="3" fill="#3B8FE0"/>
      <text x="250" y="632" fill="#C9D1DE">Anand Vihar</text>
      <rect x="360" y="622" width="94" height="13" rx="3" fill="#7DC3F5"/>
