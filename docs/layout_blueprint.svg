      <circle r="72" fill="none" stroke="#FF4757" stroke-width="26"
              stroke-dasharray="64 388" transform="rotate(151)"/>
      <circle r="72" fill="none" stroke="#7DC3F5" stroke-width="26"
              stroke-dasharray="41 411" transform="rotate(202)"/>
      <circle r="72" fill="none" stroke="#2DD4A8" stroke-width="26"
              stroke-dasharray="33 419" transform="rotate(235)"/>
      <circle r="72" fill="none" stroke="#A78BFA" stroke-width="26"
