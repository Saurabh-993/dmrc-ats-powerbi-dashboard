    <text x="34" y="654" fill="#3E4658" font-size="8">at DMRC on live ATS data under</text>
    <text x="34" y="668" fill="#3E4658" font-size="8">NDA. See repo README.</text>
    <text x="34" y="690" fill="#2DD4A8" font-size="8">github.com/you/dmrc-ats-analytics</text>

