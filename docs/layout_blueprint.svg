<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="kpiGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC72C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFC72C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="#0B0D11"/>

  <text x="24" y="30" fill="#5C677D" font-size="12" letter-spacing="2">LAYOUT BLUEPRINT &#183; 1280 &#215; 720 CANVAS &#183; NOT A SCREENSHOT</text>

  <g transform="translate(0,44)">
    <rect x="0" y="0" width="1280" height="720" fill="#0F1116"/>

    <!-- ============ LEFT FILTER RAIL ============ -->
    <rect x="16" y="16" width="196" height="688" rx="12" fill="#141821" stroke="#252A34"/>
    <text x="34" y="46" fill="#E8ECF3" font-size="15" font-weight="600">DMRC</text>
    <text x="34" y="66" fill="#5C677D" font-size="10" letter-spacing="1.6">ATS ANALYTICS</text>
    <line x1="34" y1="82" x2="194" y2="82" stroke="#252A34"/>

    <text x="34" y="110" fill="#5C677D" font-size="9" letter-spacing="1.6">METRO LINE</text>
    <g fill="#C9D1DE" font-size="11">
      <rect x="30" y="120" width="168" height="26" rx="6" fill="#1C2029"/>
      <text x="42" y="137">Yellow Line</text>
      <rect x="30" y="150" width="168" height="26" rx="6" fill="#171A21"/>
      <text x="42" y="167">Blue Line (N)</text>
      <rect x="30" y="180" width="168" height="26" rx="6" fill="#171A21"/>
      <text x="42" y="197">Red Line</text>
      <rect x="30" y="210" width="168" height="26" rx="6" fill="#171A21"/>
      <text x="42" y="227">Blue Line (V)</text>
      <rect x="30" y="240" width="168" height="26" rx="6" fill="#171A21"/>
      <text x="42" y="257">Green Line</text>
      <rect x="30" y="270" width="168" height="26" rx="6" fill="#171A21"/>
      <text x="42" y="287">Violet Line</text>
