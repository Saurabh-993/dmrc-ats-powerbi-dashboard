      <rect x="1110" y="440" width="8" height="8" fill="#3B8FE0"/><text x="1124" y="448">QR</text>
      <rect x="1160" y="440" width="8" height="8" fill="#3E4658"/><text x="1174" y="448">Other</text>
    </g>
    <g>
