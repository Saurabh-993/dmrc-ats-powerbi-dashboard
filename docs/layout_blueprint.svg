      <rect x="228" y="16" width="248" height="104" rx="12" fill="url(#kpiGlow)"/>
      <text x="250" y="46" fill="#5C677D" font-size="9" letter-spacing="1.6">TOTAL FOOTFALL</text>
      <text x="250" y="92" fill="#FFFFFF" font-size="38" font-weight="300">50,000</text>

      <rect x="488" y="16" width="248" height="104" rx="12" fill="#171A21" stroke="#252A34"/>
      <text x="510" y="46" fill="#5C677D" font-size="9" letter-spacing="1.6">TOTAL REVENUE</text>
      <text x="510" y="92" fill="#FFFFFF" font-size="38" font-weight="300">&#8377;19.8L</text>

      <rect x="748" y="16" width="248" height="104" rx="12" fill="#171A21" stroke="#252A34"/>
      <text x="770" y="46" fill="#5C677D" font-size="9" letter-spacing="1.6">AVG TICKET VALUE</text>
      <text x="770" y="92" fill="#FFFFFF" font-size="38" font-weight="300">&#8377;39.69</text>

      <rect x="1008" y="16" width="256" height="104" rx="12" fill="#171A21" stroke="#252A34"/>
      <text x="1030" y="46" fill="#5C677D" font-size="9" letter-spacing="1.6">STATIONS COVERED</text>
      <text x="1030" y="92" fill="#FFFFFF" font-size="38" font-weight="300">173</text>
    </g>

