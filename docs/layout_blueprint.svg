    <text x="34" y="402" fill="#5C677D" font-size="9" letter-spacing="1.6">DATE RANGE</text>
    <rect x="30" y="412" width="168" height="30" rx="6" fill="#171A21" stroke="#252A34"/>
    <text x="42" y="432" fill="#C9D1DE" font-size="10">28 Apr &#8211; 04 Aug 2024</text>
    <line x1="38" y1="458" x2="190" y2="458" stroke="#252A34" stroke-width="3"/>
    <circle cx="38" cy="458" r="6" fill="#2DD4A8"/>
    <circle cx="190" cy="458" r="6" fill="#2DD4A8"/>

    <rect x="30" y="490" width="168" height="34" rx="8" fill="#1C2029" stroke="#2DD4A8"/>
    <text x="114" y="512" fill="#2DD4A8" font-size="11" font-weight="600" text-anchor="middle">Reset filters</text>

    <line x1="34" y1="618" x2="194" y2="618" stroke="#252A34"/>
